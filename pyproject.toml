[project]
name = "ko-paper-explainer"
version = "0.1.0"
description = "arXiv AI 논문 초록을 쉬운 한국어로 설명하는 소형 LLM: SFT vs SFT+DPO 비교"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.15",
    "transformers>=5.22",
    "trl>=1.17",
    "peft>=0.21",
    "datasets>=5.2",
    "accelerate>=1.15",
]

[tool.uv]
package = false

# PyTorch는 CUDA 빌드를 PyTorch 공식 저장소에서 받는다 (RTX 50 시리즈는 CUDA 12.8 이상 필요)
[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
